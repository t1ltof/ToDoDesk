server {
    listen 443 ssl;
    server_name tododesk.91.186.212.152.sslip.io;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/tododesk.91.186.212.152.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tododesk.91.186.212.152.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name tododesk.91.186.212.152.sslip.io;
    return 301 https://$host$request_uri;
}
